[package]
name = "warust"
version = "0.1.8"
edition = "2024"
description = "Desktop WhatsApp gateway: many numbers in one inbox, a local REST API, signed webhooks and triggers"
license = "MIT"
repository = "https://github.com/soefyan45/warust"
readme = "README.md"
# `cargo run` starts the desktop app; the Phase 0 spike is `cargo run --bin spike`.
default-run = "warust"

# `cargo deb` (the release workflow) builds the Debian package from these.
[package.metadata.deb]
maintainer = "Soefyan Syah <2637377+soefyan45@users.noreply.github.com>"
section = "net"
priority = "optional"
depends = "$auto"
recommends = "zenity, poppler-utils, libnotify-bin, gnome-session-canberra, ffmpeg"
extended-description = """\
Many WhatsApp numbers in one inbox, a status page, a local REST API, signed \
webhooks and triggers. Unofficial client, not affiliated with WhatsApp or Meta."""
assets = [
  ["target/release/warust", "usr/bin/", "755"],
  ["packaging/linux/warust.desktop", "usr/share/applications/", "644"],
  ["assets/app/warust-256.png", "usr/share/icons/hicolor/256x256/apps/warust.png", "644"],
  ["assets/app/warust.svg", "usr/share/icons/hicolor/scalable/apps/warust.svg", "644"],
  ["README.md", "usr/share/doc/warust/", "644"],
  ["THIRD_PARTY_NOTICES.md", "usr/share/doc/warust/", "644"],
  ["LICENSE", "usr/share/doc/warust/copyright", "644"],
]

[dependencies]
# A pinned commit of the crmne fork of upstream main. crates.io 0.7.0 fails
# pairing with 401 signature-mismatch; the fix is upstream #1440, not yet
# released. Builds on stable without the `simd` feature. Back to crates.io once
# a release includes #1440.
whatsapp-rust = { git = "https://github.com/crmne/whatsapp-rust", rev = "94f7c1376f8f6a77c55d85570a260600ad27de0b", default-features = false, features = ["sqlite-storage", "sqlite-storage-bundled", "tokio-transport", "tokio-runtime", "ureq-client", "tokio-native", "signal", "voip"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }
log = "0.4"
env_logger = "0.11"
# Desktop UI. glow avoids the larger wgpu dependency.
eframe = { version = "0.37", default-features = false, features = ["glow", "wayland", "x11", "default_fonts", "accesskit"] }
# Same version eframe pulls in; named directly so the UI code can `use egui::…`.
egui = "0.37"
# Already in the tree through eframe: its arboard backend connects the system
# clipboard (text, and images for pasted screenshots) on Linux, Windows and
# macOS. eframe's own "clipboard" feature would also add smithay-clipboard.
egui-winit = { version = "0.37", default-features = false, features = ["arboard"] }
# The same arboard egui-winit pastes through; named directly to read the file
# list Finder puts on the clipboard, so a copied file pastes as an attachment.
arboard = { version = "3.7", default-features = false }
# Already in the tree through egui; color_fonts draws the colour bitmaps of the
# bundled Noto Color Emoji (assets/fonts) instead of missing-glyph boxes.
epaint = { version = "0.37", features = ["color_fonts"] }
# Loaders: SVG for the embedded lucide icons, image for cached profile pictures.
egui_extras = { version = "0.37", default-features = false, features = ["svg", "image"] }
# Already in the tree through eframe (with png); jpeg decodes profile pictures
# and encodes photos sent from the composer; webp (adds image-webp) reads and
# writes stickers.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
# Anti-peek "someone behind you" (#57): face detection on the device, with
# its model in assets/face. No rayon: one small frame every half second.
rustface = { version = "0.1.7", default-features = false }
# Local REST API (127.0.0.1 only); only the parts in use.
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
serde = { version = "1", features = ["derive"] }
# Already in the tree through whatsapp-rust: webhook delivery (ureq) and its
# HMAC-SHA256 signature.
ureq = { version = "3", default-features = false, features = ["rustls"] }
hmac = "0.13"
sha2 = { version = "0.11", default-features = false }
# Already in the tree through env_logger; webhook trigger conditions. Unicode
# case folding so "abaikan huruf besar/kecil" also covers non-ASCII text.
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-case", "unicode-perl"] }
# Encodes the pairing QR, painted as vectors in egui.
qrcode = { version = "0.14", default-features = false }
# Already in the tree through rustls/ring: OS randomness for API keys and
# webhook secrets on every OS.
getrandom = "0.3"
# Already in the tree through whatsapp-rust: the audio channels a voice call
# reads the microphone from and plays the caller into (issue #39).
async-channel = "2"
# Voice notes (issue #14): microphone capture, libopus (built from source with
# cmake and linked statically) and the Ogg container WhatsApp expects.
cpal = "0.18"
opus = "0.4"
ogg = "0.9"

# macOS, all from the objc2 family eframe/winit already pull in:
# clickable notifications (issue #15) through UserNotifications, and the
# native window buttons placed in the app's topbar (issue #22).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
raw-window-handle = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSDictionary", "NSBundle", "NSError", "NSObject", "NSSet", "NSGeometry"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "block2", "bitflags", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationSound", "UNNotificationTrigger", "UNUserNotificationCenter"] }
# PDF previews with macOS's own renderer (CoreGraphics), so no poppler is
# needed there; both crates are already in the tree through arboard and winit.
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFURL", "CFCGTypes"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGBitmapContext", "CGColorSpace", "CGContext", "CGImage", "CGPDFDocument", "CGPDFPage"] }
# Native window buttons in the top bar, the unread count on the Dock icon, and
# the menu bar icon (#134); already in the tree through winit.
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "NSApplication", "NSDockTile", "NSResponder", "NSView", "NSWindow", "NSControl", "NSButton", "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSMenu", "NSMenuItem", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphics"] }

# Windows: toasts through WinRT, the same windows crate accesskit already uses;
# the Win32 parts are the tray icon and its menu (#134).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["UI_Notifications", "Data_Xml_Dom", "Foundation", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

# Linux: the tray icon (#134) as a StatusNotifierItem over D-Bus, so no GTK.
# zbus is already in the tree through accesskit, on async-io; ksni's default
# tokio feature would switch that zbus to tokio, so it stays off.
[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3.7", default-features = false, features = ["async-io", "blocking"] }

# The face detector is slow unoptimised; keep it fast in debug runs too.
[profile.dev.package.rustface]
opt-level = 3

[profile.release]
# Smaller downloads: no symbol tables in the shipped binary.
strip = true
