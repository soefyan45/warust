# Builds warust for Linux (.deb), Windows (.zip) and macOS (universal .dmg).
# A tag like v0.1.0 also publishes them as a GitHub Release; running it by hand
# (Actions → Release → Run workflow) only keeps the files as build artifacts.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux (.deb)
    # The oldest supported runner, so the binary runs on older glibc too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-deb
        run: cargo install cargo-deb --locked
      - name: Build package
        run: cargo deb --output target/dist/
      - name: Name it
        run: |
          version="${GITHUB_REF_NAME#v}"
          mv target/dist/*.deb "target/dist/warust_${version}_amd64.deb"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: target/dist/*.deb

  windows:
    name: Windows (.zip)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --bin warust
      - name: Package
        shell: pwsh
        run: |
          $name = "warust-$env:GITHUB_REF_NAME-windows-x86_64"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item target/release/warust.exe, README.md, LICENSE, THIRD_PARTY_NOTICES.md "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip

  macos:
    name: macOS (.dmg)
    runs-on: macos-14
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain and targets
        run: |
          rustup toolchain install
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build (Apple Silicon and Intel)
        run: |
          cargo build --release --bin warust --target aarch64-apple-darwin
          cargo build --release --bin warust --target x86_64-apple-darwin
      - name: Bundle warust.app
        run: |
          version="${GITHUB_REF_NAME#v}"
          app=dist/warust.app
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          lipo -create -output "$app/Contents/MacOS/warust" \
            target/aarch64-apple-darwin/release/warust target/x86_64-apple-darwin/release/warust
          sed "s/VERSION/$version/g" packaging/macos/Info.plist > "$app/Contents/Info.plist"
          iconset=dist/warust.iconset
          mkdir -p "$iconset"
          for size in 16 32 128 256 512; do
            sips -z $size $size assets/app/warust-1024.png --out "$iconset/icon_${size}x${size}.png" >/dev/null
            double=$((size * 2))
            sips -z $double $double assets/app/warust-1024.png --out "$iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns "$iconset" -o "$app/Contents/Resources/warust.icns"
          # Ad-hoc signature: required for Apple Silicon; not a developer ID.
          codesign --force --deep --sign - "$app"
      - name: Make the disk image
        run: |
          mkdir -p dist/dmg
          cp -R dist/warust.app dist/dmg/
          ln -s /Applications dist/dmg/Applications
          cp README.md LICENSE THIRD_PARTY_NOTICES.md dist/dmg/
          hdiutil create -volname warust -srcfolder dist/dmg -ov -format UDZO \
            "dist/warust-$GITHUB_REF_NAME-macos-universal.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.dmg

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "warust $GITHUB_REF_NAME" \
            --generate-notes
