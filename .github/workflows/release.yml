# Builds warust for Linux (.deb), Windows (.zip) and macOS (universal .dmg,
# Developer ID signed and notarized from the "release" environment's APPLE_*
# secrets, which only v* tags can reach).
# A tag like v0.1.0 also publishes them as a GitHub Release; running it by hand
# (Actions → Release → Run workflow) only keeps the files as build artifacts.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux (.deb)
    # The oldest supported runner, so the binary runs on older glibc too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: ALSA headers (microphone for voice notes)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Install cargo-deb
        run: cargo install cargo-deb --locked
      - name: Build package
        run: cargo deb --output target/dist/
      - name: Name it
        run: |
          version="${GITHUB_REF_NAME#v}"
          mv target/dist/*.deb "target/dist/warust_${version}_amd64.deb"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: target/dist/*.deb

  windows:
    name: Windows (.zip)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --bin warust
      - name: Package
        shell: pwsh
        run: |
          $name = "warust-$env:GITHUB_REF_NAME-windows-x86_64"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item target/release/warust.exe, README.md, LICENSE, THIRD_PARTY_NOTICES.md "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip

  macos:
    name: macOS (.dmg)
    runs-on: macos-latest
    # The APPLE_* secrets live in the "release" environment, which only v*
    # tags may use (and only the owner may create those). Runs from a branch
    # get no environment, so a changed workflow on a branch cannot read them;
    # they fall back to an ad-hoc signature.
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || '' }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain and targets
        run: |
          rustup toolchain install
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build (Apple Silicon and Intel)
        run: |
          cargo build --release --bin warust --target aarch64-apple-darwin
          cargo build --release --bin warust --target x86_64-apple-darwin
      - name: Bundle warust.app
        run: |
          version="${GITHUB_REF_NAME#v}"
          app=dist/warust.app
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          lipo -create -output "$app/Contents/MacOS/warust" \
            target/aarch64-apple-darwin/release/warust target/x86_64-apple-darwin/release/warust
          sed "s/VERSION/$version/g" packaging/macos/Info.plist > "$app/Contents/Info.plist"
          iconset=dist/warust.iconset
          mkdir -p "$iconset"
          for size in 16 32 128 256 512; do
            sips -z $size $size assets/app/warust-1024.png --out "$iconset/icon_${size}x${size}.png" >/dev/null
            double=$((size * 2))
            sips -z $double $double assets/app/warust-1024.png --out "$iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns "$iconset" -o "$app/Contents/Resources/warust.icns"
      - name: Import the Developer ID certificate
        id: cert
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ] || [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            # A release must never ship unsigned; a manual run may fall back to ad-hoc.
            if [ "$GITHUB_REF_TYPE" = "tag" ]; then
              echo "::error::APPLE_CERTIFICATE / APPLE_SIGNING_IDENTITY secrets are missing"
              exit 1
            fi
            echo "::warning::No Developer ID secrets; signing ad-hoc (not notarized)"
            echo "identity=-" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 16)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          rm "$RUNNER_TEMP/cert.p12"
          echo "identity=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_OUTPUT"
      - name: Sign warust.app
        env:
          IDENTITY: ${{ steps.cert.outputs.identity }}
        run: |
          if [ "$IDENTITY" = "-" ]; then
            # Ad-hoc signature: required for Apple Silicon; not a developer ID.
            codesign --force --sign - dist/warust.app
          else
            # Hardened runtime and a secure timestamp are required for notarization.
            # The entitlements let the hardened app use the microphone (voice notes).
            codesign --force --options runtime --timestamp --entitlements packaging/macos/warust.entitlements \
              --sign "$IDENTITY" dist/warust.app
          fi
          codesign --verify --strict --verbose=2 dist/warust.app
      - name: Make the disk image
        env:
          IDENTITY: ${{ steps.cert.outputs.identity }}
        run: |
          mkdir -p dist/dmg
          cp -R dist/warust.app dist/dmg/
          ln -s /Applications dist/dmg/Applications
          cp README.md LICENSE THIRD_PARTY_NOTICES.md dist/dmg/
          dmg="dist/warust-$GITHUB_REF_NAME-macos-universal.dmg"
          # hdiutil's own size estimate for -srcfolder can come out too small
          # ("No space left on device"), so the size is given with room to spare.
          size=$(( $(du -sm dist/dmg | cut -f1) + 64 ))
          hdiutil create -volname warust -srcfolder dist/dmg -ov -fs HFS+ -size "${size}m" -format UDZO "$dmg"
          if [ "$IDENTITY" != "-" ]; then
            codesign --force --timestamp --sign "$IDENTITY" "$dmg"
          fi
      - name: Notarize and staple
        if: steps.cert.outputs.identity != '-'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          dmg="dist/warust-$GITHUB_REF_NAME-macos-universal.dmg"
          # The ticket covers the dmg and the app inside it.
          xcrun notarytool submit "$dmg" \
            --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" \
            --wait --timeout 30m
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"
      - name: Remove the signing keychain
        if: always() && steps.cert.outputs.identity != '' && steps.cert.outputs.identity != '-'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.dmg

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # warust checks a downloaded update against this before installing it (#93).
      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "warust $GITHUB_REF_NAME" \
            --generate-notes
